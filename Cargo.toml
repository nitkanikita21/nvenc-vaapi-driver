[workspace]
resolver = "3"
members = ["crates/va-sys"]

[package]
name = "libvaapi-rust-nvenc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

# Cargo builds libnvidia_nvenc_drv_video.so; installation supplies libva's
# expected nvidia_nvenc_drv_video.so filename.
[lib]
name = "nvidia_nvenc_drv_video"
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
profiling = []

[dependencies]
va-sys = { path = "crates/va-sys" }
slotmap = "1"
parking_lot = "0.12"
thiserror = "2"
libc = "0.2"
# CUDA Driver API via `cudarc`. `dynamic-loading` delays the dlopen of
# libcuda.so.1 until the first API call, so the .so still loads on machines
# without a CUDA-capable GPU. Device allocation and encoding initialise CUDA;
# context creation itself only retains the requested configuration.
cudarc = { version = "0.19", default-features = false, features = ["driver", "cuda-12020", "dynamic-loading"] }
# Use the SDK ABI types without its unconditional NVENC/NVDEC linker
# directives. api.rs loads NVENC explicitly at runtime.
nvidia-video-codec-sdk = { version = "0.4", features = ["ci-check"] }
libloading = "0.8"
# Supply a fixed CUDA binding version for the SDK's transitive cudarc.
# Cargo unifies features additively; this avoids probing nvcc even though
# the dependency also enables cuda-version-from-build-system.
[dependencies.cudarc_016]
package = "cudarc"
version = "0.16"
default-features = false
features = ["driver", "cuda-12020", "dynamic-loading"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
once_cell = "1"
va-sys = { path = "crates/va-sys" }
libc = "0.2"
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"  # required: we catch_unwind at the ABI boundary
